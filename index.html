<style>
:root{
  --bg:#05080d; --panel:#0b1018; --panel-2:#0e141e;
  --line:rgba(120,160,200,0.09); --line-strong:rgba(120,170,210,0.20);
  --text:#e8eef6; --text-2:#9fb0c4; --text-3:#5f7287;
  --cyan:#2fd4e6; --cyan-deep:#0fa8c2; --blue:#3b82f6; --violet:#a78bfa;
  --glow:rgba(47,212,230,0.45);
  --font-body:'Sora',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-mono:'Spline Sans Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font-body);background:var(--bg);color:var(--text);
  min-height:100svh;-webkit-font-smoothing:antialiased;overflow:hidden;position:relative;
}
.hidden{display:none!important}

/* loading screen */
#staticrypt_loading{position:fixed;inset:0;display:flex;align-items:center;
  justify-content:center;background:var(--bg);z-index:50}
.spinner{width:34px;height:34px;border:2px solid var(--line-strong);
  border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.stage{min-height:100svh;display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));
  position:relative}

/* ambient field */
.field{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.grid{position:absolute;inset:-2px;
  background-image:linear-gradient(rgba(47,212,230,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(47,212,230,.035) 1px,transparent 1px);
  background-size:48px 48px;
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 42%,#000 25%,transparent 78%);
  mask-image:radial-gradient(ellipse 70% 60% at 50% 42%,#000 25%,transparent 78%);
  transform:translateZ(0)}
.orb{position:absolute;border-radius:50%;filter:blur(120px);transform:translateZ(0)}
.orb.c{width:520px;height:520px;background:rgba(47,212,230,.13);
  top:-180px;left:50%;margin-left:-360px;animation:drift 22s ease-in-out infinite}
.orb.v{width:440px;height:440px;background:rgba(167,139,250,.10);
  bottom:-200px;right:-120px;animation:drift 26s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(34px,40px)}}
.sweep{position:absolute;top:0;left:0;width:160%;height:100%;
  background:linear-gradient(105deg,transparent 42%,rgba(47,212,230,.05) 50%,transparent 58%);
  animation:sweep 9s linear infinite}
@keyframes sweep{0%{transform:translateX(-60%)}100%{transform:translateX(20%)}}

.shell{position:relative;z-index:2;width:100%;max-width:452px;
  animation:rise .9s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

.mark{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.30em;
  text-transform:uppercase;color:var(--cyan);text-align:center;
  opacity:.9;margin-bottom:26px;line-height:1.5}
.mark span{display:inline-flex;align-items:center}
.mark span::before,.mark span::after{content:"";display:inline-block;width:22px;height:1px;
  margin:0 12px;background:linear-gradient(90deg,transparent,var(--cyan-deep))}
.mark span::after{background:linear-gradient(90deg,var(--cyan-deep),transparent)}

.card{background:linear-gradient(180deg,var(--panel),var(--panel-2));
  border:1px solid var(--line-strong);border-radius:20px;
  padding:42px 36px 36px;position:relative;overflow:hidden;
  box-shadow:0 30px 80px -30px rgba(0,0,0,.85),
    inset 0 1px 0 rgba(255,255,255,.03),0 0 0 1px rgba(47,212,230,.04)}
.card::before{content:"";position:absolute;top:0;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,var(--glow),transparent)}

.lede{text-align:center;margin-bottom:30px}
.lede .eyebrow{font-family:var(--font-mono);font-size:.64rem;letter-spacing:.26em;
  text-transform:uppercase;color:var(--text-3);margin-bottom:16px}
h1{font-family:var(--font-display);font-weight:500;line-height:1.02;
  font-size:clamp(2rem,8vw,2.7rem);letter-spacing:-.015em;color:var(--text)}
h1 .em{font-style:italic;font-weight:500;
  background:linear-gradient(118deg,#7ee8f3,var(--cyan) 48%,var(--violet));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--cyan)}
.lede p{color:var(--text-2);font-size:.94rem;margin-top:14px;line-height:1.6}

#staticrypt-form{display:flex;flex-direction:column;gap:14px}
.field-row{position:relative}
.field-row .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;stroke:var(--text-3);fill:none;pointer-events:none}
#staticrypt-password{width:100%;background:#070b11;border:1px solid var(--line-strong);
  border-radius:13px;padding:16px 52px 16px 46px;color:var(--text);
  font-family:var(--font-body);font-size:1rem;letter-spacing:.02em;
  transition:border-color .2s,box-shadow .2s;outline:none}
#staticrypt-password::placeholder{color:var(--text-3)}
#staticrypt-password:focus{border-color:rgba(47,212,230,.5);
  box-shadow:0 0 0 4px rgba(47,212,230,.12)}
.toggle-wrap{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  display:flex;padding:9px;border-radius:9px;cursor:pointer}
.staticrypt-toggle-password-visibility{width:18px;height:18px;opacity:.55;
  transition:opacity .15s;cursor:pointer}
.toggle-wrap:hover .staticrypt-toggle-password-visibility{opacity:1}

#staticrypt-remember-label{display:flex;align-items:center;gap:10px;padding:2px;
  color:var(--text-2);font-size:.82rem;cursor:pointer;user-select:none}
#staticrypt-remember{appearance:none;-webkit-appearance:none;width:17px;height:17px;
  border:1px solid var(--line-strong);border-radius:5px;background:#070b11;
  cursor:pointer;position:relative;flex-shrink:0;transition:.15s}
#staticrypt-remember:checked{background:var(--cyan-deep);border-color:var(--cyan)}
#staticrypt-remember:checked::after{content:"";position:absolute;left:5px;top:1px;
  width:5px;height:10px;border:solid #04222a;border-width:0 2px 2px 0;transform:rotate(43deg)}

.staticrypt-decrypt-button{margin-top:4px;border:none;cursor:pointer;border-radius:13px;
  padding:16px;font-family:var(--font-body);font-size:.98rem;font-weight:600;
  letter-spacing:.02em;color:#04222a;width:100%;
  background:linear-gradient(120deg,var(--cyan),var(--cyan-deep));
  box-shadow:0 10px 30px -10px var(--glow);transition:filter .18s,transform .1s}
.staticrypt-decrypt-button:hover{filter:brightness(1.08)}
.staticrypt-decrypt-button:active{transform:translateY(1px)}

.foot{margin-top:24px;text-align:center;font-family:var(--font-mono);
  font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text-3)}

@media(max-width:420px){.card{padding:34px 24px 30px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== signal-convergence reveal overlay ===== */
/* ===== composed entrance ===== */
/* the gate's quiet step-back when the key is accepted (runs before content swap) */
.gate-exit{animation:gateRecede .42s cubic-bezier(.4,0,.6,1) forwards!important}
@keyframes gateRecede{
  to{opacity:0;transform:translateY(-8px) scale(.985);filter:blur(3px)}
}
/* the hairline + content stagger are injected/driven from JS so they survive the
   <head> swap at commit (see ENTRANCE_CSS and playReveal) */
</style>
</head>

      </div>
      <div class="foot">Authorised Members Only</div>
